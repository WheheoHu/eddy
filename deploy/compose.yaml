services:
  eddy-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # Shown by `eddy-server --version` and to clients. Set it when
        # building: EDDY_GIT_HASH=$(git rev-parse --short HEAD) docker compose build
        EDDY_GIT_HASH: ${EDDY_GIT_HASH:-}
    image: eddy-server:local
    restart: unless-stopped
    # Reaps yt-dlp/ffmpeg children and passes SIGTERM on.
    init: true
    env_file: .env
    volumes:
      - eddy-data:/data
    ports:
      # Loopback only unless EDDY_PUBLISH_ADDRESS in .env says otherwise.
      # Exposing it further is a deliberate step: the server speaks plain
      # HTTP, so beyond a network you trust put it behind the same HTTPS
      # reverse proxy as FreshRSS.
      - "${EDDY_PUBLISH_ADDRESS:-127.0.0.1}:8787:8080"

volumes:
  eddy-data:

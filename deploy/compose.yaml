services:
  eddy-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: eddy-server:local
    restart: unless-stopped
    env_file: .env
    volumes:
      - eddy-data:/data
    ports:
      # Loopback only. Exposing it further is a deliberate step: put it behind
      # the same HTTPS reverse proxy as FreshRSS when devices need it.
      - "127.0.0.1:8787:8080"

volumes:
  eddy-data:

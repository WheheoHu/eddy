<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Save to Eddy — Settings</title>
  <link rel="icon" href="icons/icon-32.png">
  <style>
    :root {
      color-scheme: light dark;
      --page: #f6f6f7; --card: #ffffff; --text: #1c1c1e; --muted: #5f5f65; --line: rgba(0, 0, 0, 0.12);
      --field: rgba(0, 0, 0, 0.05); --accent: #0a84ff; --good: #1f8a4c; --bad: #c23a2b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #19191b; --card: #202022; --text: #f2f2f4; --muted: #a6a6ac; --line: rgba(255, 255, 255, 0.14);
        --field: rgba(255, 255, 255, 0.07); --good: #5fd08c; --bad: #ff7b6b;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 620px; margin: 0 auto; padding: 48px 24px 64px; }
    header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
    header img { width: 44px; height: 44px; }
    header h1 { font-size: 22px; margin: 0; }
    header span { color: var(--muted); font-size: 13px; }
    section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 22px 24px; }
    h2 { font-size: 16px; margin: 0 0 4px; }
    .about { color: var(--muted); margin: 0 0 18px; }
    label { display: block; font-weight: 600; margin: 16px 0 6px; }
    label small { font-weight: 400; color: var(--muted); }
    input {
      width: 100%; font: inherit; padding: 8px 10px; border-radius: 7px; color: inherit;
      border: 1px solid transparent; background: var(--field); outline: none;
    }
    input:focus { border-color: var(--accent); }
    .actions { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
    .actions .space { flex: 1; }
    button {
      font: inherit; font-weight: 500; padding: 7px 16px; border-radius: 7px; cursor: pointer;
      border: 1px solid var(--line); background: transparent; color: inherit;
    }
    button.primary { border-color: var(--accent); background: var(--accent); color: white; }
    button:disabled { opacity: 0.5; cursor: default; }
    #status { min-height: 20px; margin-top: 14px; word-break: break-word; }
    #status.good { color: var(--good); }
    #status.bad { color: var(--bad); }
    .rules { display: flex; align-items: center; gap: 10px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); }
    .rules span { flex: 1; }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="icons/icon-128.png" alt="">
      <div>
        <h1>Save to Eddy</h1>
        <span id="version"></span>
      </div>
    </header>
    <section>
      <h2>RSSHub</h2>
      <p class="about">RSSHub makes feeds for sites that have none of their own.</p>
      <label for="rsshub">Instance</label>
      <input id="rsshub" type="url" placeholder="https://rsshub.app" spellcheck="false" autocomplete="off">
      <label for="key">Access key <small>(only for an instance that sets one)</small></label>
      <input id="key" type="text" spellcheck="false" autocomplete="off">
      <div class="actions">
        <button id="test">Test</button>
        <span class="space"></span>
        <button id="save" class="primary">Save</button>
      </div>
      <div id="status" role="status"></div>
      <div class="rules">
        <span id="rules"></span>
        <button id="update">Update Rules</button>
      </div>
    </section>
  </main>
  <script src="radar.js"></script>
  <script src="options.js"></script>
</body>
</html>

name: CI

# Every commit pushed to any branch is checked for formatting, linted and
# tested. What the run builds anyway (the server binary and the Mac app) is
# kept as artifacts for two weeks, for trying a commit without building it,
# and the server image of dev and main goes to ghcr.io.
# Tags are the release workflow's business.
on:
  push:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Warnings fail the build here; locally they are just warnings.
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      # The browser extension's own logic: rule matching, the popup, its
      # settings, the number on its icon.
      - run: for test in extensions/tests/*.test.js; do node "$test" || exit 1; done

  core:
    # The whole workspace builds on macOS: eddy-pdf links the static pdfium
    # that scripts/fetch-pdfium.sh downloads for it. eddy-ffi and the Apple
    # app exist only there.
    name: Lint and test (macOS, whole workspace)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Fetch pdfium
        run: scripts/fetch-pdfium.sh macos
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked

  windows:
    # What of the core a Windows machine can build and run: the engine and
    # the headless CLI (the Mac app is Apple-only). pdfium is a DLL loaded
    # from next to the executable, so fetching it is enough for tests.
    name: Test (Windows, core and CLI)
    runs-on: windows-latest
    env:
      # The core job owns linting; a second MSVC toolchain's extra warnings
      # would only add noise here.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch pdfium
        shell: bash
        run: scripts/fetch-pdfium.sh windows
      - name: Test
        shell: bash
        run: cargo test --locked -p eddy-core -p eddy-store -p eddy-pdf
      - name: Build CLI
        run: cargo build --locked -p eddy-cli
      # The core job owns linting the whole workspace on macOS, but the code
      # compiled only on Windows would otherwise never be linted.
      - name: Clippy (Windows-only crates)
        shell: bash
        run: cargo clippy --locked -p eddy-cli -p eddy-pdf --all-targets -- -D warnings

  server:
    # The server ships as a Linux image, so what it is made of is also
    # tested there, and the image has to build.
    name: Test and build image (Linux, server)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To push the image of dev and main to ghcr.io.
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked -p eddy-server -p eddy-core -p eddy-store -p eddy-sync -p eddy-model
      - name: Build image
        run: docker build -f deploy/Dockerfile --build-arg "EDDY_GIT_HASH=${GITHUB_SHA::7}" -t eddy-server:ci .
      - name: Image starts and reports its version
        run: |
          docker run -d --name eddy -p 127.0.0.1:8787:8080 \
            -e "EDDY_MASTER_KEY=$(openssl rand -base64 32)" eddy-server:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/v1/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/v1/health
          docker exec eddy eddy-server --version | grep "${GITHUB_SHA::7}"
      # The image is built and has just been seen to start: publish it for
      # the long-lived branches, as :dev / :main (moving) and :sha-<commit>
      # (fixed). linux/amd64 only; release tags publish both architectures
      # as :X.Y.Z and :latest.
      - name: Push image to ghcr.io
        if: github.ref_name == 'dev' || github.ref_name == 'main'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/eddy-server"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in "$GITHUB_REF_NAME" "sha-${GITHUB_SHA::7}"; do
            docker tag eddy-server:ci "$image:$tag"
            docker push "$image:$tag"
          done
          echo "Pushed \`$image:$GITHUB_REF_NAME\` and \`$image:sha-${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
      # The binary is already built inside the image: keep it. It runs on
      # Debian 12 (bookworm) or anything with a glibc at least as new.
      - name: Take the server binary out of the image
        run: |
          docker cp eddy:/usr/local/bin/eddy-server eddy-server
          tar -czf "eddy-server-${GITHUB_SHA::7}-linux-amd64.tar.gz" eddy-server
      - uses: actions/upload-artifact@v7
        with:
          name: eddy-server-linux-amd64
          path: eddy-server-*-linux-amd64.tar.gz
          retention-days: 14
          if-no-files-found: error

  mac-app:
    name: Build Mac app
    runs-on: macos-15
    env:
      # Xcode builds the Swift side; Rust warnings are the core job's business.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Install XcodeGen
        run: brew install xcodegen
      # Release configuration: it is what a release tag builds, and it makes
      # the artifact below an app worth trying.
      - name: Build
        run: scripts/build-mac-app.sh release
      - name: Build log
        if: failure()
        run: tail -n 200 build/xcodebuild.log || true
      # Zipped with ditto first: uploading the bundle as loose files would
      # drop its executable bits and symlinks.
      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            apple/DerivedData/Build/Products/Release/Eddy.app \
            "Eddy-${GITHUB_SHA::7}-mac-arm64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: eddy-mac-arm64
          path: Eddy-*-mac-arm64.zip
          retention-days: 14
          if-no-files-found: error
